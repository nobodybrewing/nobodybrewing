<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Age verification | Nobody Brewing Limited</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1d3a32;
      --ink: #eef0dc;
      --muted: #b3c2b2;
      --amber: #e8a92b;
      --amber-deep: #c98d14;
      --line: rgba(238, 240, 220, 0.35);
      --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-weight: 500;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }

    .gate {
      min-height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(28px + env(safe-area-inset-top, 0px)) 24px calc(28px + env(safe-area-inset-bottom, 0px));
    }

    .brand {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-align: center;
    }

    .logo {
      display: block;
      margin: 0 auto;
      width: 160px;
      max-width: 60%;
      height: auto;
    }
    .trading-name {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-align: center;
    }
    main {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding: 32px 0;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2.6rem, 12vw, 4.2rem);
      font-weight: 800;
      line-height: 0.98;
      letter-spacing: -0.02em;
    }

    .lead {
      margin: 0 0 36px;
      max-width: 34ch;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .actions {
      display: grid;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 14px 20px;
      border-radius: 14px;
      border: 2px solid transparent;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .btn:active { transform: scale(0.98); }

    .btn:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    .btn-yes {
      background: var(--amber);
      color: #1d3a32;
    }
    .btn-yes:hover { background: var(--amber-deep); }

    .btn-no {
      background: transparent;
      color: var(--ink);
      border-color: var(--line);
    }
    .btn-no:hover { background: rgba(238, 240, 220, 0.08); }

    .fine {
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    @media (min-width: 700px) {
      .gate { padding-left: 48px; padding-right: 48px; }
      main { max-width: 480px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
      .btn:active { transform: none; }
    }
  </style>
</head>
<body>
  <div class="gate">
      <div class="brand">
      <img class="logo" src="Group 76.png" alt="Nobody Brewing Co.">
      <p class="trading-name">Nobody Brewing Limited</p>
      </div>
      <h1>Are you 18 or over?</h1>
      <p class="lead">You need to be of legal drinking age to enter this site.</p>

      <div class="actions">
        <a class="btn btn-yes" href="https://nobodybrewingco.company.site/">Yes, I am over 18</a>
        <a class="btn btn-no" href="https://youthlaw.co.nz/rights/health-wellbeing/alcohol/">No, I am under 18</a>
      </div>
    </main>

    <p class="fine">Please enjoy responsibly.</p>
  </div>
</body>
</html>
